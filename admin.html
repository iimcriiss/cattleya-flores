<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Reseñas · Cattleya</title>
<style>
  body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#FDF0EC;color:#3a2620;padding:20px}
  main{max-width:760px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 16px}
  input,button{font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid #3a2620}
  button{cursor:pointer;background:#fff}
  .ok{background:#3a2620;color:#fff}
  .del{border-color:#c0392b;color:#c0392b}
  .card{display:flex;gap:14px;background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 4px 14px -8px rgba(90,40,25,.4)}
  .card img{width:96px;height:128px;object-fit:cover;border-radius:10px;flex:none}
  .card p{margin:6px 0}
  .tag{font-size:.8rem;padding:2px 10px;border-radius:99px;background:#ffe3a3}
  .tag.pub{background:#c9f0d3}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  #msg{color:#c0392b;min-height:1.4em}
</style>
</head>
<body>
<main>
  <h1>Reseñas de Cattleya</h1>
  <form id="login">
    <input id="key" type="password" placeholder="Clave de administración" autocomplete="current-password" required>
    <button class="ok" type="submit">Entrar</button>
  </form>
  <p id="msg"></p>
  <div id="lista"></div>
</main>
<script src="js/admin-panel.js"></script>
</body>
</html>
